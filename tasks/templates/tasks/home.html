<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
</head>
<body>
    <h1>My Task List</h1>

    <!-- The Form to Add a Task -->
    <form method="POST">
        {% csrf_token %} 
        {{ form.as_p }}
        <button type="submit">Add Task</button>
    </form>

    <!-- The List of Tasks -->
    <ul>
        {% for task in tasks %}
            <li>
                <!-- Show the title with a line-through if completed -->
                <span style="{{ task.completed|yesno:'text-decoration: line-through;, ' }}">
                    {{ task.title }} ({{ task.category }})
                </span>

                <!-- The Toggle Button -->
                <a href="{% url 'toggle_task' task.id %}">
                    {% if task.completed %}Mark Incomplete{% else %}Mark Done{% endif %}
                </a>

                <!-- The Delete Button -->
                <a href="{% url 'delete_task' task.id %}" style="color: red;">Delete</a>
            </li>
        {% empty %}
            <li>No tasks yet!</li>
        {% endfor %}
    </ul>
</body>
</html>
