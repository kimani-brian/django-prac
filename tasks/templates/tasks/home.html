<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks</title>
</head>
<body>
    <h1>My Task List</h1>

    <!-- The Form to Add a Task -->
    <form method="POST">
        {% csrf_token %} 
        {{ form.as_p }}
        <button type="submit">Add Task</button>
    </form>

    <!-- The List of Tasks -->
    <ul>
        {% for task in tasks %}
            <li>{{ task.title }}</li>
        {% empty %}
            <li>No tasks yet!</li>
        {% endfor %}
    </ul>
</body>
</html>
